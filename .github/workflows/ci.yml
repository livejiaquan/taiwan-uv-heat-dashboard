name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test public build configuration
        run: npm run test:public-build-config

      - name: Build public artifact and enforce no-key guard
        env:
          PUBLIC_BASE_PATH: "/taiwan-uv-heat-dashboard/"
          VITE_CWA_API_KEY: ""
        run: npm run build:public

      - name: Verify root-host public artifact
        env:
          PUBLIC_BASE_PATH: "/"
          VITE_CWA_API_KEY: ""
        run: npm run build:public
